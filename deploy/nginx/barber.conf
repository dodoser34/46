# Nginx перед приложением на VPS: принимает запросы из интернета (порт 80/443)
# и передаёт их серверу Blind Barber на 127.0.0.1:8000.
# Скрипт deploy/vps/install.sh ставит этот файл сам и подставляет домен вместо DOMAIN_PLACEHOLDER.
# HTTPS добавляется командой: sudo certbot --nginx -d ваш-домен.kz
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
